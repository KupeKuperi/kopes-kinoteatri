# The iPhone app (ios/, plan: ios/GUIDE.md). Linux: the Rust core's tests and the live smoke test
# against MovieBox. Mac: the core built for iOS, the SwiftUI app generated with XcodeGen, its tests
# in the iOS Simulator (search, streams, play from live MovieBox: the video must advance; the app's
# screens) and an unsigned .ipa for AltStore, uploaded only inside a password-protected zip (repo
# secret IPA_PASSWORD) because the repo is public.
name: iOS

on:
  push:
    branches: [main, ios-app, 'ios-*']
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      core:
        description: 'Core: engine (live MovieBox) or stub (canned titles, Apple test stream)'
        type: choice
        options: [engine, stub]
        default: engine

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # THE core switch: the core the app is built with on pushes, "engine" or "stub" ("Run workflow"
  # picks one per run).
  KINO_CORE: ${{ inputs.core || 'engine' }}
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core tests + live smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios
          cache-on-failure: true

      - name: Tests (engine core)
        run: cargo test -p kino-core

      - name: Tests (stub core)
        run: cargo test -p kino-core --no-default-features

      - name: Smoke test against live MovieBox
        env:
          KINO_DATA: ${{ runner.temp }}/kino-smoke
        run: cargo run -p kino-core --bin kino-smoke

  ios:
    name: iPhone app (Simulator tests, unsigned .ipa)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        # Named explicitly so steps run with -o pipefail (xcodebuild | xcbeautify).
        shell: bash
        working-directory: ios/app
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # CoreSimulator's start and a simulator's first boot take minutes on these Macs: they run
      # while the core and the app build.
      - name: Boot an iPhone simulator (in the background)
        run: nohup bash scripts/boot-simulator.sh "$RUNNER_TEMP/simulator-udid" > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios
          key: ${{ env.KINO_CORE }}
          cache-on-failure: true

      - name: Build the core for iOS (${{ env.KINO_CORE }})
        run: |
          if [ "$KINO_CORE" = engine ]; then export CORE_FEATURES=""; else export CORE_FEATURES="--no-default-features"; fi
          bash scripts/build-core.sh

      - name: Generate the Xcode project
        id: project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Build the app and its tests for the Simulator
        id: build
        run: |
          mkdir -p build
          if command -v xcbeautify > /dev/null; then fmt="xcbeautify --renderer github-actions"; else fmt=cat; fi
          xcodebuild build-for-testing \
            -project Kinoteatri.xcodeproj -scheme Kinoteatri \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            2>&1 | tee build/xcodebuild-build.log | $fmt

      - name: Unsigned device build (.ipa)
        id: device
        if: ${{ !cancelled() && steps.project.outcome == 'success' }}
        run: |
          if command -v xcbeautify > /dev/null; then fmt="xcbeautify --renderer github-actions"; else fmt=cat; fi
          xcodebuild build \
            -project Kinoteatri.xcodeproj -scheme Kinoteatri \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild-device.log | $fmt
          rm -rf build/ipa build/Kinoteatri.ipa
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Kinoteatri.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Kinoteatri.ipa Payload)
          ls -l build/Kinoteatri.ipa
          du -sh build/ipa/Payload/Kinoteatri.app

      - name: Wait for the simulator
        id: boot
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          for _ in $(seq 1 300); do [ -s "$RUNNER_TEMP/simulator-udid" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/simulator-boot.log" || true
          udid=$(cat "$RUNNER_TEMP/simulator-udid")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          if ! xcrun simctl bootstatus "$udid" -b > "$RUNNER_TEMP/bootstatus.log" 2>&1; then
            tail -n 30 "$RUNNER_TEMP/bootstatus.log"
            exit 1
          fi
          tail -n 3 "$RUNNER_TEMP/bootstatus.log"

      - name: Tests in the Simulator
        id: tests
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        env:
          UDID: ${{ steps.boot.outputs.udid }}
        run: |
          if command -v xcbeautify > /dev/null; then fmt="xcbeautify --renderer github-actions"; else fmt=cat; fi
          rm -rf build/KinoteatriTests.xcresult
          # A video of the Simulator's screen while the tests run (best effort).
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force build/simulator.mp4 > build/recording.log 2>&1 &
          recorder=$!
          status=0
          xcodebuild test-without-building \
            -project Kinoteatri.xcodeproj -scheme Kinoteatri \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/dd \
            -resultBundlePath build/KinoteatriTests.xcresult \
            -parallel-testing-enabled NO \
            2>&1 | tee build/xcodebuild-test.log | $fmt || status=$?
          # Ctrl-C finishes the recording's file.
          kill -INT "$recorder" 2> /dev/null || true
          for _ in $(seq 1 15); do kill -0 "$recorder" 2> /dev/null || break; sleep 1; done
          kill -9 "$recorder" 2> /dev/null || true
          grep -h "\[kino\]" build/xcodebuild-test.log || true
          exit "$status"

      - name: Export the test attachments
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: |
          [ -d build/KinoteatriTests.xcresult ] || exit 0
          out=build/attachments
          xcrun xcresulttool export attachments --path build/KinoteatriTests.xcresult --output-path "$out" || exit 0
          # Human names (the export names files by UUID).
          jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | join("|")' "$out/manifest.json" 2> /dev/null |
            while IFS='|' read -r file name; do [ -n "$name" ] && mv "$out/$file" "$out/$name"; done || true
          ls -la "$out"
          for f in "$out"/summary*; do [ -f "$f" ] && { echo "== $f"; cat "$f"; echo; }; done

      - name: Keep the test results
        if: ${{ always() && steps.project.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests-${{ env.KINO_CORE }}
          path: |
            ios/app/build/attachments/
            ios/app/build/simulator.mp4
            ios/app/build/*.log
            ios/app/build/KinoteatriTests.xcresult/
          if-no-files-found: ignore
          retention-days: 7

      - name: Password-protect the .ipa
        id: ipa
        if: steps.tests.outcome == 'success' && steps.device.outcome == 'success'
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          if [ -z "$IPA_PASSWORD" ]; then
            echo "::notice::The repo secret IPA_PASSWORD isn't set, so the .ipa is not uploaded (the repo is public)."
            exit 0
          fi
          (cd build && zip -q -P "$IPA_PASSWORD" Kinoteatri-ipa.zip Kinoteatri.ipa)
          echo "zip=ios/app/build/Kinoteatri-ipa.zip" >> "$GITHUB_OUTPUT"

      - name: Keep the .ipa (password-protected zip, 3 days)
        if: steps.ipa.outputs.zip != ''
        uses: actions/upload-artifact@v7
        with:
          name: Kinoteatri-ipa-${{ env.KINO_CORE }}
          path: ${{ steps.ipa.outputs.zip }}
          retention-days: 3
          compression-level: 0
