# Windows installer (Setup.exe) for the app packaged by scripts/package.mjs.
# Build with `npm run dist`; the installer lands in dist/.
appId: com.kupekuperi.kopeskinoteatri
# File and folder names stay plain ASCII; people see "Kope's Kinoteatri" (shortcuts, Apps & features).
productName: KopesKinoteatri
executableName: KopesKinoteatri
copyright: Copyright © 2026 KupeKuperi
directories:
  output: dist
  buildResources: build
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  # A normal installer: per-user by default (no admin prompt), folder can be changed.
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Kope's Kinoteatri
  uninstallDisplayName: Kope's Kinoteatri
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: KopesKinoteatri-Setup-${version}.exe
  # Watch history, favorites and settings belong to the engine and stay on uninstall.
  deleteAppDataOnUninstall: false
