# Kope's Kinoteatri for iPhone: the Xcode project, generated with XcodeGen (`xcodegen generate` in
# this folder; the .xcodeproj and Info.plist it writes are not committed). The Rust core (ios/core)
# is linked as Frameworks/KinoCore.xcframework, built by scripts/build-core.sh. Plan: ios/GUIDE.md.
name: Kinoteatri

options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Swift sees the core's C header (ios/core/include/kino.h) as the module KinoFFI.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/KinoFFI
    # The core is built for Apple Silicon simulators only (scripts/build-core.sh).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    # Simulator builds are signed ad hoc. Device builds are made unsigned (CI) and AltStore signs
    # them on the phone; to run from Xcode on a phone, set your team here.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

targets:
  Kinoteatri:
    type: application
    platform: iOS
    sources:
      - path: Kinoteatri
    dependencies:
      # The Rust core, a static library: linked into the app, not embedded.
      - framework: Frameworks/KinoCore.xcframework
        embed: false
      # The system libraries it needs, as rustc lists them (build-core.sh prints them; with the
      # engine: "native-static-libs: -framework CoreFoundation -liconv -lSystem -lc -lm"). libSystem,
      # libc and libm are always linked; CoreFoundation is for the engine's time zone lookup.
      - sdk: libiconv.tbd
      - sdk: CoreFoundation.framework
      # The car's screen (CarPlay templates) and Now Playing / the lock screen's buttons.
      - sdk: CarPlay.framework
      - sdk: MediaPlayer.framework
    info:
      path: Kinoteatri/Info.plist
      properties:
        CFBundleDisplayName: Kinoteatri
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          # The phone's window is SwiftUI's (WindowGroup); the car's screen is a CarPlay template
          # scene (CarPlay/CarPlaySceneDelegate.swift, @objc name "CarPlaySceneDelegate").
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: CarPlaySceneDelegate
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Sound keeps playing in the background, in picture in picture and in the car (CarPlay
        # needs it too).
        UIBackgroundModes:
          - audio
        UISupportsDocumentBrowser: false
        # AVPlayer plays from the core's local server, http://127.0.0.1:<port>.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kope.kinoteatri
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # CarPlay's entitlement (com.apple.developer.carplay-audio), for Simulator builds only: the
        # Simulator's CarPlay window shows the app with it. A device build would need a provisioning
        # profile that has it (Apple grants it to paid developer accounts on request; AltStore's
        # free signing can't), so device builds leave it out. See ios/CARPLAY.md.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Kinoteatri-CarPlay.entitlements

  KinoteatriTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KinoteatriTests
    dependencies:
      # Hosted by the app: the tests use the app's copy of the core (one core per process).
      - target: Kinoteatri
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kope.kinoteatri.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kinoteatri.app/Kinoteatri
        BUNDLE_LOADER: $(TEST_HOST)

  KinoteatriUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KinoteatriUITests
    dependencies:
      # Drives the app itself (search, title, player) and screenshots each screen.
      - target: Kinoteatri
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kope.kinoteatri.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kinoteatri

schemes:
  Kinoteatri:
    build:
      targets:
        Kinoteatri: all
        KinoteatriTests: [test]
        KinoteatriUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      # No automatic screenshots or screen recordings of failed UI tests: they would show the film
      # in the public test results (the tests attach their own screenshots).
      captureScreenshotsAutomatically: false
      targets:
        - name: KinoteatriTests
          parallelizable: false
        - name: KinoteatriUITests
          parallelizable: false
    archive:
      config: Release
